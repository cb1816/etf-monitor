<html lang="it">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>ETF Monitor</title>
<style>
:root{--bg:#0b1220;--panel:#131c2e;--panel2:#1b2942;--line:#25324d;--txt:#e8edf6;--mut:#93a1b8;
  --accent:#4f9cff;--pos:#22c55e;--neg:#f4536b;--warn:#f5b642;--chip:#1e2c46;--hot:#ff7a45;--pair:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 96px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b1220 72%,rgba(11,18,32,.92));padding:calc(12px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.hrow{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:0;white-space:nowrap}h1 b{color:var(--accent)}
.hmeta{max-width:760px;margin:2px auto 0}
.sub{font-size:11.5px;color:var(--mut);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asof{display:block;font-size:12.5px;font-weight:700;color:var(--txt);line-height:1.35;margin-top:1px;white-space:nowrap}
.infob{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--chip);border:1px solid var(--line);color:var(--accent);font-weight:800;font-style:italic;font-family:Georgia,serif;font-size:15px;line-height:1;cursor:pointer;padding:0}
.ihead{font-size:12.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 5px}
.ihead.hot{color:var(--hot)}
.ibox{background:rgba(255,122,69,.10);border:1px solid rgba(255,122,69,.35);border-radius:10px;padding:11px 13px;margin-top:4px}
.ip{font-size:12.5px;color:var(--txt);line-height:1.5;margin:0 0 7px}
.ip b{color:#fff}
.istep{display:flex;gap:9px;margin:8px 0;font-size:12.5px;line-height:1.45}
.istep .n{flex:0 0 20px;height:20px;border-radius:50%;background:var(--hot);color:#1a0d06;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
.controls{max-width:760px;margin:8px auto 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--chip);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:#04101f;border-color:var(--accent)}
.chip.mom.on{background:var(--hot);color:#1a0d06;border-color:var(--hot)}
.row2{display:flex;gap:6px;margin-top:6px}
select,input{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;width:100%;font-family:inherit}
select{flex:1;min-width:0}
.searchw{position:relative;flex:1}.searchw input{padding-left:32px}
.searchw::before{content:"🔎";position:absolute;left:9px;top:8px;font-size:14px;opacity:.6}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d1626;border-top:1px solid var(--line);display:grid;grid-template-columns:2fr 3fr;gap:6px;z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
/* Layout v3: viste in due gruppi colorati, come le due domande */
.ng{border-radius:10px;padding:3px 2px 0;min-width:0}
.ng.sel{background:rgba(79,156,255,.07)}.ng.all{background:rgba(245,182,66,.06)}
.ngl{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;text-align:center;white-space:nowrap}
.ng.sel .ngl{color:var(--accent)}.ng.all .ngl{color:var(--warn)}
.ngb{display:flex}
nav button{flex:1;min-width:0;background:none;border:none;color:var(--mut);padding:9px 2px 10px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.ng.sel button.on{color:var(--accent);font-weight:800}.ng.all button.on{color:var(--warn);font-weight:800}
.side{display:contents}
.filtbtn{display:flex;align-items:center;gap:8px;width:100%;max-width:760px;margin:8px auto 0;background:#111b2d;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--txt);font-family:inherit}
.filtbtn .fk{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.filtbtn .fs{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filtbtn .fm{font-size:12px;font-weight:700;color:var(--accent)}
.controls{display:none}
header.fopen .controls{display:block;max-height:62vh;overflow-y:auto;background:#111b2d;border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;margin-top:6px}
.fhead{display:flex;align-items:baseline;margin-bottom:6px}
.fhead span{flex:1;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.azz{background:none;border:none;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;padding:4px 2px;font-family:inherit}
.flbl{font-size:10.5px;color:var(--mut);margin:8px 2px 4px}
.vhead{border-radius:12px;padding:10px 12px;margin:10px 0 4px;display:flex;flex-direction:column;gap:8px}
.vhead.sel{background:rgba(79,156,255,.07);border:1px solid rgba(79,156,255,.30)}
.vhead.all{background:rgba(245,182,66,.06);border:1px solid rgba(245,182,66,.28)}
.vtop{display:flex;align-items:baseline;gap:8px}
.vlab{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.vhead.sel .vlab{color:var(--accent)}.vhead.all .vlab{color:var(--warn)}
.vtit{font-size:16px;font-weight:800}
.vrow{display:flex;align-items:center;gap:8px;min-width:0}
.vrow .chips{flex:1;min-width:0;padding-bottom:0}
.vk{flex:0 0 auto;font-size:11px;color:var(--mut)}
.vhead .sortrow{margin:0;align-items:center}
.vhead.all .sortrow .sc.on{border-color:var(--warn)}
.sortrow .sc{font-family:inherit}
.vnote{font-size:11px;color:var(--mut);line-height:1.45}
.vhead #vtools:empty{display:none}
header.fopen{position:relative}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer}
.card:active{background:var(--panel2)}
.rank{flex:0 0 30px;text-align:center;font-weight:800;font-size:15px;color:var(--mut)}
.rank.t{color:var(--pos)}.rank.b{color:var(--neg)}
.info{flex:1;min-width:0}
.nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.val{flex:0 0 auto;text-align:right;min-width:66px}
.pct{font-size:16px;font-weight:800}
.pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--mut)}
.stars{font-size:10px;color:var(--warn);margin-top:1px;letter-spacing:1px}
.badges{margin-top:2px;display:flex;gap:4px;flex-wrap:wrap}
.qbadge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:5px}
.q1{background:rgba(34,197,94,.16);color:var(--pos)}.q4{background:rgba(244,83,107,.16);color:var(--neg)}
.mbadge{background:rgba(255,122,69,.18);color:var(--hot)}
.sec{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 4px 6px}
.sec.flop{color:var(--neg)}.sec.top{color:var(--pos)}.sec.hot{color:var(--hot)}
.sec.pair{color:var(--pair);display:flex;align-items:center;gap:8px}
.ipair{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.45);color:var(--pair);font-weight:800;font-style:italic;font-family:Georgia,serif;font-size:12px;line-height:1;cursor:pointer;padding:0}
.paircard{background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.28);border-left:3px solid var(--pair);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.paircard .ph{display:flex;align-items:flex-start;gap:10px}
.paircard .pn{font-size:14px;font-weight:700;line-height:1.25}
.paircard .pk{font-size:11px;color:var(--mut);margin-top:2px}
.paircard .pv{margin-left:auto;text-align:right;font-size:17px;font-weight:800;white-space:nowrap}
.paircard .pu{font-size:10px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.paircard .pmeta{font-size:10.5px;color:var(--mut);margin-top:6px;line-height:1.45}
.spark{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 6px 2px;margin-top:7px}
.empty{color:var(--mut);text-align:center;padding:40px 10px;font-size:13px}
.catcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.cathead{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer}
.cathead .cn{flex:1;font-size:13.5px;font-weight:700;min-width:0}
.cathead .cval{text-align:right;flex:0 0 auto}
.cathead .cv{font-size:15px;font-weight:800}
.cathead .cmeta{font-size:10.5px;color:var(--mut)}
.catbody{border-top:1px solid var(--line);padding:4px 12px 8px;display:none}
.catcard.open .catbody{display:block}
.mini{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
.mini:last-child{border-bottom:none}.mini .mn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlbl{font-size:10px;color:var(--mut);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.5px}
.sortrow{display:flex;gap:6px;margin:10px 4px 4px}
.sortrow .sc{font-size:11.5px;font-weight:700;color:var(--mut);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.sortrow .sc.on{background:var(--panel2);color:var(--txt);border-color:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(4,8,16,.7);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:760px;border-radius:16px 16px 0 0;border-top:1px solid var(--line);max-height:88vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-size:16px;margin:0 6px 2px 0}.sheet .mc{font-size:12px;color:var(--mut);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid.g2{grid-template-columns:1fr 1fr}
.kv{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.kv .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kv .v{font-size:16px;font-weight:800;margin-top:2px}.kv .v.sm{font-size:13px}
.closex{float:right;background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer}
.note{font-size:11px;color:var(--mut);margin-top:10px;line-height:1.5}
.pill{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--mut);margin:0 5px 4px 0}
.mombar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:6px}
.mombar>i{display:block;height:100%;background:linear-gradient(90deg,#f4536b,#f5b642,#22c55e)}
.chartbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 8px 4px;margin-top:4px}
.chartbox svg{display:block;width:100%;height:110px}
.chleg{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);padding:2px 4px 0}
.maprow{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.maprow:active{background:var(--panel2)}
.mlbl2{flex:0 0 42%;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:7px}
.mlbl2 .cn2{color:var(--txt)}.mlbl2 small{color:var(--mut)}
.mval2{flex:0 0 54px;text-align:right;font-size:12.5px;font-weight:800}
.mbarwrap{position:relative;flex:1;height:15px}
.mzero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.mbar{position:absolute;top:3px;height:9px;border-radius:2px}
.mbar.mp{background:var(--pos)}.mbar.mn{background:var(--neg)}
/* Barra di My Way: ← My Way · Portafogli · Fondi · ETF (Magüt), 28/09/2026 */
.suite{max-width:760px;margin:0 auto 8px;display:flex;gap:6px;flex-wrap:wrap}
.suite a,.suite span,.suite button{font-size:12px;font-weight:600;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;line-height:1.4;background:none;font-family:inherit;cursor:pointer}
.suite span{color:#04101f;background:var(--accent);border-color:var(--accent)}
.suite a:hover,.suite button:hover{color:var(--txt)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;max-width:min(92vw,460px);z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.suite a.home{color:var(--accent);border-color:transparent;padding-left:2px}
/* Scheda categoria v2 (01/10/2026): sezioni 1/2, gruppi-indice, barre divergenti */
.chev{flex:0 0 auto;color:var(--mut);font-size:18px;line-height:1}
.ctag{display:inline-block;margin-top:5px;font-size:10px;font-weight:700;color:var(--accent);background:rgba(79,156,255,.13);border-radius:5px;padding:2px 6px}
.qe{background:rgba(79,156,255,.14);color:var(--accent)}
.card:has(.irow){flex-wrap:wrap;row-gap:0}
.irow{flex:0 0 100%;display:flex;align-items:center;gap:8px;border-top:1px solid rgba(255,255,255,.06);margin-top:7px;padding-top:7px;min-width:0}
.irow .qbadge{flex:0 0 auto}.irow .ie{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .id{flex:0 0 auto;font-size:11.5px;color:var(--mut)}
.back{display:block;background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;padding:0 0 8px;cursor:pointer;font-family:inherit;text-align:left;max-width:calc(100% - 44px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ip.mut{color:var(--mut)}
.secn{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.secn .b{font-size:11px;font-weight:800;color:#04101f;background:var(--mut);border-radius:5px;padding:2px 7px}
.secn .b.a2{background:var(--accent)}
.secn .t{font-size:12.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.secn .s{font-size:11px;color:var(--mut)}
.alloc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.alloc .atop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.alloc .big{font-size:26px;font-weight:800}.alloc .of{font-size:13px;color:var(--mut)}
.spill{font-size:12px;font-weight:700;color:var(--txt);background:var(--chip);border-radius:999px;padding:3px 10px;white-space:nowrap}
.abar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}.abar>i{display:block;height:100%}
.alloc .m4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.alloc .m4 .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.alloc .m4 .v{font-size:14px;font-weight:800}
.gcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ghead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gname{font-size:14.5px;font-weight:800}.gn{margin-left:auto;font-size:11px;color:var(--mut)}
.gbest{font-size:12.5px;line-height:1.45;margin:6px 0 4px}
.gex{font-size:11px;color:var(--mut);margin-top:2px}
.more{display:block;background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;padding:8px 0 2px;cursor:pointer;font-family:inherit}
.tdr{display:grid;grid-template-columns:20px minmax(0,1fr) 64px 46px;align-items:center;gap:8px;padding:8px 0 4px;border-top:1px solid rgba(255,255,255,.05);cursor:pointer}
.tdr.tdh{cursor:default;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding:4px 0 3px;border-top:none;border-bottom:1px solid var(--line)}
.tdr.tdh span:nth-child(n+3){text-align:right}
.tdr .r{font-size:12px;font-weight:800;color:var(--mut)}
.tdr .nmw{display:flex;flex-direction:column;gap:5px;min-width:0}
.tdr .tn{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar{position:relative;height:6px;background:rgba(255,255,255,.04);border-radius:3px}
.dbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#3a4a69}
.dbar i{position:absolute;top:0;height:6px;border-radius:3px}
.dbar i.p{left:50%;background:var(--pos)}.dbar i.n{right:50%;background:var(--neg)}
.tdr .tv{text-align:right;font-size:13px;font-weight:800}
.tdr .tv small{display:block;font-size:9.5px;font-weight:600;color:var(--mut)}
.tdr .ter{text-align:right;font-size:11.5px;color:var(--mut)}
details.altri{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:6px}
details.altri summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer}
details.altri summary::-webkit-details-marker{display:none}
details.altri .st{flex:1}details.altri .st b{display:block;font-size:13.5px}
details.altri .st small{display:block;font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.4}
details.altri[open] .chev{transform:rotate(180deg)}
details.altri[open]{padding-bottom:8px}
.gbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12px}
.gbox .gl{font-size:11.5px;color:var(--mut);line-height:1.55}.gbox .gl a{color:inherit}
/* Layout PC (01/10/2026): solo schermi larghi con mouse. Telefoni e tablet touch restano identici. */
@media (min-width:1024px) and (hover:hover) and (pointer:fine){
:root{--side:300px;--maxw:1240px}
body{padding-left:var(--side)}
/* Layout v3: la colonna di sinistra e' il pannello di comando (nome, viste, filtri) */
.side{display:flex;flex-direction:column;gap:12px;position:fixed;left:0;top:0;bottom:0;width:var(--side);overflow-y:auto;background:#0d1626;border-right:1px solid var(--line);padding:16px 14px;z-index:30;box-sizing:border-box}
header{display:contents}
.hrow{order:1;max-width:none;margin:0;padding:0 4px}.hmeta{order:2;max-width:none;margin:-8px 0 0;padding:0 4px}
nav{order:3}.controls{order:4}.suite{order:5;margin:auto 0 0;padding:0 4px;max-width:none}
.suite{gap:4px}.suite a,.suite span,.suite button{font-size:11.5px;padding:2px 8px}
.toast{bottom:24px}
h1{font-size:17px}
.filtbtn{display:none}
.controls{display:flex;flex-direction:column;background:#111b2d;border:1px solid var(--line);border-radius:12px;padding:10px;margin:0;max-width:none}
.controls .row2{margin:0}
.flbl{margin:9px 2px 4px}
#macroChips{display:grid;grid-template-columns:1fr 1fr;gap:4px;overflow:visible;padding:0}
#tipoChips{flex-wrap:wrap;overflow:visible;gap:4px;padding:0}
.controls .chip{font-size:11.5px;padding:5px 8px;border-radius:7px;white-space:normal;line-height:1.25}

<script>
(function(){
  /* --- Livello sopra app.js: testata con la data su una riga sua. --------------
     app.js scrive in #cnt "N strumenti · fonte · data": qui, a caricamento finito,
     la riscriviamo su due righe (conteggio attenuato / data in evidenza) e la
     fonte la spostiamo nel pannello Info. app.js e api/ restano intatti. */
  function pad2(n){return(n<10?'0':'')+n}
  function itDate(s){
    var m=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/.exec(String(s==null?'':s));
    return m?pad2(+m[1])+'/'+pad2(+m[2])+'/'+m[3]:String(s==null?'':s).trim();
  }
  function head(d){
    var meta=(d&&d.meta)||{},cnt=document.getElementById('cnt'),as=document.getElementById('asof');
    var n=(meta.nTot!=null?meta.nTot:(meta.nData!=null?meta.nData:null));
    if(cnt)cnt.textContent=(n!=null?Number(n).toLocaleString('it'):'—')+' strumenti';
    var dt=itDate(meta.date);
    if(as)as.textContent=dt?('dati al '+dt):'';
    var b=document.getElementById('infoBtn');
    if(b){var prev=b.onclick;b.onclick=function(e){
      if(prev)prev.call(this,e);
      var sh=document.getElementById('sheet');
      if(sh&&!sh.querySelector('.srcnote')){
        var p=document.createElement('div');p.className='note srcnote';
        p.textContent='Fonte dati: '+(meta.source||'—')+(dt?(' · aggiornamento del '+dt):'');
        sh.appendChild(p);
      }
    };}
  }
  function run(d){window.DATA=d;var s=document.createElement('script');s.src='app.js?v=19';
    s.onload=function(){try{head(d)}catch(e){}};document.body.appendChild(s);}
  function withFilter(d){
    return Promise.resolve(d)
      .catch(function(){return d});
  }
  fetch('/api/data').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(withFilter).then(run)
    .catch(function(){fetch('data/snapshot.json').then(function(r){return r.json()}).then(function(d){d.meta.source+=' · snapshot offline';return withFilter(d)}).then(run)});
})();
</script>
<a href="https://oicr-monitor.vercel.app" style="position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));right:14px;z-index:50;background:#1e293b;color:#e2e8f0;padding:8px 12px;border-radius:20px;font-size:12px;text-decoration:none;border:1px solid #334155">⇄ Fondi</a>
<script>
/* Voce "Clienti" della barra della suite: apre il CRM (Portfolio Workbench) sul Mac con il collegamento
   portfolioworkbench://apri, come in My Way (clienti.js). Nessun dato passa di qui. */
(function(){var b=document.getElementById('clienti');if(!b)return;
  var avviso=function(t){var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;
    document.body.appendChild(d);setTimeout(function(){d.remove()},7000);};
  b.addEventListener('click',function(){
    var mac=/Mac/.test(navigator.platform||navigator.userAgent)&&!/iPhone|iPad/.test(navigator.userAgent)&&navigator.maxTouchPoints<2;
    if(!mac){avviso('Clienti è il CRM e si apre solo sul Mac. I dati dei clienti non escono dal Mac.');return;}
    var aperto=false,via=function(){aperto=true;};
    window.addEventListener('blur',via,{once:true});document.addEventListener('visibilitychange',via,{once:true});
    location.href='portfolioworkbench://apri';avviso('Apro il CRM sul Mac… ci vuole qualche secondo.');
    setTimeout(function(){window.removeEventListener('blur',via);document.removeEventListener('visibilitychange',via);
      if(!aperto&&document.hasFocus())avviso('Il CRM non ha risposto. Se non si apre, aprilo dal Dock o dalla Scrivania.');},8000);});
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});</script>
